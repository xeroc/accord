[package]
name = "canon"
version.workspace = true
edition.workspace = true
description = "Accord Canon — curated-list / token-registry Arbitrable that files disputes via the Accord"

[lib]
crate-type = ["cdylib", "lib"]
name = "canon"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Required by `anchor build` for IDL generation since anchor 0.30 (#2824).
# Propagated to `accord` so IDL gen resolves the CPI dependency.
idl-build = ["anchor-lang/idl-build", "accord/idl-build"]

[dependencies]
anchor-lang.workspace = true
# CPI into Accord's `create_subaccord` at `create_list`. The `cpi` feature sets
# `no-entrypoint` so the crate links as a library (types + cpi module only).
accord = { path = "../accord", features = ["cpi"] }

[target.'cfg(not(target_os = "solana"))'.dev-dependencies]
anchor-litesvm = "0.4"
anchor-lang = { workspace = true }
solana-program = "3"
solana-sdk = "3"
