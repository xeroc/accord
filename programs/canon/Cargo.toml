[package]
name = "canon"
version.workspace = true
edition.workspace = true
description = "Accord Canon — curated-list / token-registry Arbitrable that files disputes via the Accord"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "canon"
# canon has zero doctests (all prose comments, no fenced code blocks). The
# `--doc` harness only compiles the lib as a doctest wrapper — and since canon
# depends on `accord` via a workspace path dep, that wrapper context is the
# surface where cargo's feature-unification intermittently fails with
# `E0463: can't find crate for accord` after a stale build state. Disabling
# doctests removes the failure surface without losing coverage (there's nothing
# to run). Coverage lives in `tests/*_litesvm.rs` (LiteSVM) + e2e.
doctest = false

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Required by `anchor build` for IDL generation since anchor 0.30 (#2824).
idl-build = ["anchor-lang/idl-build", "accord/idl-build"]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
# `accord` is used at runtime (state.rs: `accord::ID`, `accord::constants::SEED_SUBACCORD`;
# CPI into `create_subaccord`/`create_dispute`), not just in tests — must be a normal dep.
accord = { path = "../accord", features = ["cpi"] }

# LiteSVM harness (veridao-8ys4): fast in-process Rust unit/TDD per instruction.
# Mirrors programs/accord/Cargo.toml's dev-dep block.
[target.'cfg(not(target_os = "solana"))'.dev-dependencies]
anchor-litesvm = "0.4"
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
solana-program = "3"
solana-sdk = "3"
spl-associated-token-account = "8"
spl-token = "9"
solana-compute-budget = "3"
litesvm = "0.11"
