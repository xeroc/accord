[package]
name = "accord"
version.workspace = true
edition.workspace = true
description = "Accord — general-purpose Schelling-point arbitration accord on Solana"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "accord"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Required by `anchor build` for IDL generation since anchor 0.30 (#2824).
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
solana-program.workspace = true
ephemeral-rollups-sdk.workspace = true
# `#[zero_copy]` macro references `bytemuck` at the crate root; anchor-lang
# re-exports the traits but the derive macro emits `::bytemuck::Pod`.
bytemuck = "1"

# LiteSVM harness (veridao-8ys4): fast in-process Rust unit/TDD per instruction.
#
# VENDORED anchor-litesvm 0.4.0 (harness/anchor-litesvm, accord-cvxo), retargeted
# from litesvm 0.11 (agave 3.1.x) to litesvm 0.16 (agave 4.2/sbpf 0.21) — only
# the agave-4 line loads the canonical sBPFv3 ELF the v1.57 sbpfv3 target emits
# (agave 3.1.x's sbpf expects a transitional v3 shape no toolchain produces).
# Same typed Anchor
# builder: `ctx.program().request().accounts(..).args(..).instruction()` ->
# `ctx.execute_instruction(ix, &[&kp]).assert_success()`.
#
# The safe-solana-builder `references/litesvm.md` stays the *checklist/pattern*
# authority for every instruction bean (happy/auth/reinit/time-lock/arithmetic/
# closure, sysvar manipulation, CU profiling) — wiring differs, concepts don't.
[target.'cfg(not(target_os = "solana"))'.dev-dependencies]
# xeroc's fork of anchor-litesvm carries the litesvm 0.16 (agave 4.2) bump —
# upstream 0.4.0 pins litesvm ^0.11/agave 3.1, whose sbpf cannot load the
# canonical sBPFv3 ELF (brimigs/anchor-litesvm#3, PR #4). Swap back to a
# registry version the day upstream releases (bean accord-jhzr).
solana-account = "4.3.0"
anchor-litesvm = { git = "https://github.com/xeroc/anchor-litesvm.git", branch = "litesvm-0.16-sbpfv3" }
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
solana-program = "3"
solana-sdk = "3"
# For stake tests: derive the Subaccord PDA's vault ATA address + unpack SPL
# token accounts for balance assertions. Pinned to match litesvm-utils'
# resolved versions so no extra copies land in the dep tree.
spl-associated-token-account = "8"
spl-token = "9"
