site_name: Accord
site_description: Mechanize the verdict. Schelling-point arbitration on Solana — two CPI calls resolve any subjective dispute.
site_url: https://example.com/TBD
repo_url: https://github.com/xeroc/accord
repo_name: xeroc/accord
copyright: Accord — Mechanize the verdict.

# Brand: see BRAND.md. Identity = "The Mechanist" (BRAND.md, locked 2026-08-04).
# Palette: ink + cyan. Distinct from Solana purple/green by design.

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: fontawesome/solid/scale-balanced
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Integration Guide:
      - integration/index.md
      - The Arbitrable Interface: integration/arbitrable-interface.md
      - Subaccords: integration/subaccords.md
      - Staking as a Juror: integration/staking.md
      - Filing a Dispute: integration/disputes.md
      - Draw & Voting: integration/draw-voting.md
      - Appeals: integration/appeals.md
      - Reading the Ruling: integration/get-ruling.md
  - Protocol Reference:
      - reference/index.md
      - Accounts & PDAs: reference/accounts.md
      - Instructions: reference/instructions.md
      - State Machine: reference/state-machine.md
      - Error Codes: reference/errors.md
      - Constants: reference/constants.md
  - Security:
      - security/index.md
      - Snapshot Fraud Proofs: security/fraud-proofs.md
      - Sortition & VRF: security/sortition-vrf.md
      - Circuit Breaker: security/circuit-breaker.md
  - Architecture:
      - adr/index.md
      - "0001 Schelling over hired judges": adr/0001-schelling-accord-replaces-hired-judges.md
      - "0002 Per-Subaccord staking token": adr/0002-per-subaccord-staking-token-no-accord-token-v1.md
      - "0003 Draw — Merkle Snapshot, distinct VRF": adr/0003-accord-draw-merkle-snapshot-distinct-vrf.md
      - "0004 Party-agnostic, permissionless appeal": adr/0004-accord-party-agnostic-permissionless-appeal.md
      - "0005 Subaccord authority + 48h timelock": adr/0005-subaccord-authority-pubkey-timelock.md
      - "0006 Evidence — on-chain hash, trusted operator": adr/0006-evidence-onchain-hash-trusted-re-encryption-operator.md
      - "0007 Upgrade authority — multisig then freeze": adr/0007-upgrade-authority-multisig-then-freeze.md
      - "0008 Snapshot trust hardening": adr/0008-snapshot-trust-hardening-anchor-slot-and-verifiable-sortition.md
      - "0009 Stake-weighted verifiable sortition": adr/0009-stake-weighted-verifiable-sortition-mst-committed-vrf.md
      - "0010 SDK — Codama + Kit + facade": adr/0010-sdk-codama-solana-kit-facade.md
  - SDK: sdk.md

plugins:
  - search:
  - privacy:
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Usage documentation:
          - index.md: Main documentation page
          - "*.md"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji ""
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ""

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xeroc/accord
    - icon: fontawesome/brands/twitter
      link: https://x.com/xer0c
  status:
    accepted: Accepted

extra_css:
  - overrides/styles.css
