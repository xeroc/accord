<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Accord — Mechanize the verdict.">
  <rect width="1200" height="630" fill="#0A0E14"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1F2630" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="80" y="118" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="26" font-weight="500" letter-spacing="6" fill="#F0A830">JUSTICE IS INFRASTRUCTURE</text>

  <!-- headline -->
  <text x="76" y="238" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="106" font-weight="600" letter-spacing="-2" fill="#F0F6FC">Mechanize the verdict.</text>

  <!-- code surface -->
  <rect x="80" y="300" width="1040" height="128" rx="10" fill="#11161D" stroke="#1F2630" stroke-width="1.5"/>
  <text x="116" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#C9D1D9">create_dispute()</text>
  <text x="566" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#F0A830">&#8594;</text>
  <text x="624" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#C9D1D9">get_ruling()</text>

  <!-- footer line -->
  <text x="80" y="560" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="26" fill="#7D8590">useaccord.xyz  ·  Schelling-point arbitration on Solana</text>

  <!-- convergence glyph, bottom-right -->
  <g transform="translate(1060,520)" stroke="#F0A830" stroke-width="3.4" stroke-linecap="square" fill="none">
    <line x1="0" y1="6" x2="34" y2="34"/>
    <line x1="68" y1="6" x2="34" y2="34"/>
    <line x1="34" y1="68" x2="34" y2="34"/>
  </g>
  <circle cx="1094" cy="554" r="5" fill="#F0A830"/>
</svg>
