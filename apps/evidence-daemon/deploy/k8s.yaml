# Evidence Operator daemon — HA Kubernetes deployment (ADR-0011, bean accord-vx8c).
#
# N stateless replicas behind a Service (ClusterIP) + Ingress (TLS termination).
# Shared state: EVIDENCE_KEYRING env + S3 bucket — every replica is identical.
# No session affinity. Liveness & readiness use GET /healthz (S3+RPC probe);
# the LB / ingress drains on 503.
#
# Apply secrets out-of-band (sealed-secrets / external-secrets / Vault). The
# EVIDENCE_KEYRING value (and S3 credentials) MUST NEVER be committed.
#
# deploy:
#   kubectl apply -k .            # or: kubectl apply -f deploy/k8s.yaml
#
# ponytail: no Helm chart for v1 — a flat manifest is the minimum that
# expresses the HA topology. Parameterize (replicas, image tag) via kustomize
# or sed at deploy time; add Helm when >1 environment demands it.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evidence-daemon
  labels:
    app.kubernetes.io/name: evidence-daemon
data:
  # Non-secret runtime config. Secrets live in the Secret below.
  EVIDENCE_PORT: "8080"
  EVIDENCE_RPC_URL: "https://api.mainnet-beta.solana.com"
  EVIDENCE_PROGRAM_ID: "RokLJyruq34Ubtaj8mFnQETKcZpNCbW6k6xsgrMoHEe"
  EVIDENCE_S3_ENDPOINT: "https://s3.us-east-1.amazonaws.com"
  EVIDENCE_S3_BUCKET: "accord-evidence"
  EVIDENCE_S3_REGION: "us-east-1"
  EVIDENCE_S3_FORCE_PATH_STYLE: "false"
  EVIDENCE_RATE_LIMIT_PER_MIN: "120"
  EVIDENCE_MAX_EVIDENCE_BYTES: "10485760" # 10 MiB
  EVIDENCE_HEALTH_TIMEOUT_MS: "2000"
  EVIDENCE_RETENTION_DAYS: "90"
  # End-to-end TLS off in-pod by default; TLS terminates at the Ingress.
  EVIDENCE_TLS_CERT: ""
  EVIDENCE_TLS_KEY: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: evidence-daemon-secret
  labels:
    app.kubernetes.io/name: evidence-daemon
type: Opaque
# stringData filled by your secret manager — NEVER commit real values.
#   EVIDENCE_KEYRING: <base58 Ed25519 secret, comma-separated for >1 operator>
#   EVIDENCE_S3_ACCESS_KEY_ID: ...
#   EVIDENCE_S3_SECRET_ACCESS_KEY: ...
stringData: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-daemon
  labels:
    app.kubernetes.io/name: evidence-daemon
spec:
  replicas: 2 # HA: >=2 stateless replicas (ADR-0011 §HA)
  selector:
    matchLabels:
      app.kubernetes.io/name: evidence-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evidence-daemon
    spec:
      securityContext:
        runAsNonRoot: true
        # No core dumps (ADR-0006 trusted-component hardening). The kernel's
        # core_pattern is the real control; this is belt-and-suspenders.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evidence-daemon
          image: ghcr.io/accord/evidence-daemon:latest # set real tag at release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidence-daemon
            - secretRef:
                name: evidence-daemon-secret
          # LB drains on 503; ready only when Storage + RPC are reachable.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: evidence-daemon
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: evidence-daemon
  labels:
    app.kubernetes.io/name: evidence-daemon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: evidence-daemon
  ports:
    - name: http
      port: 80
      targetPort: http

# --- TLS termination at the edge (Ingress). Not included inline — enable per
# environment; see deploy/README.md (§TLS / §High availability).
