<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Canon — Curated lists, trustless verdicts.">
  <rect width="1200" height="630" fill="#0A0E14"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1F2630" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="80" y="112" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="26" font-weight="500" letter-spacing="6" fill="#F0A830">CANON &#183; REGISTRY ON ACCORD</text>

  <!-- headline (two lines) -->
  <text x="76" y="204" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="90" font-weight="600" letter-spacing="-2" fill="#F0F6FC">Curated lists,</text>
  <text x="76" y="298" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="90" font-weight="600" letter-spacing="-2" fill="#F0F6FC">trustless verdicts.</text>

  <!-- code surface -->
  <rect x="80" y="352" width="1040" height="128" rx="10" fill="#11161D" stroke="#1F2630" stroke-width="1.5"/>
  <text x="116" y="428" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#C9D1D9">submit_item()</text>
  <text x="489" y="428" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#F0A830">&#8594;</text>
  <text x="573" y="428" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#C9D1D9">settle_item()</text>

  <!-- footer line -->
  <text x="80" y="560" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="26" fill="#7D8590">canon.useaccord.xyz &#160;&#183;&#160; Curated-list registry, adjudicated by Accord</text>

  <!-- registry glyph, bottom-right: two rows, one verified -->
  <g transform="translate(1058,516)">
    <rect x="0" y="0" width="18" height="18" rx="3" stroke="#7D8590" stroke-width="2.4" fill="none"/>
    <line x1="26" y1="9" x2="66" y2="9" stroke="#7D8590" stroke-width="2.4"/>
    <rect x="0" y="30" width="18" height="18" rx="3" stroke="#F0A830" stroke-width="2.4" fill="none"/>
    <line x1="5" y1="39" x2="9" y2="43" stroke="#F0A830" stroke-width="2.4"/>
    <line x1="9" y1="43" x2="15" y2="34" stroke="#F0A830" stroke-width="2.4"/>
    <line x1="26" y1="39" x2="66" y2="39" stroke="#F0A830" stroke-width="2.4"/>
  </g>
</svg>
