<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Synod — Convene the verdict.">
  <rect width="1200" height="630" fill="#0A0E14"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1F2630" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="80" y="118" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="26" font-weight="500" letter-spacing="6" fill="#F0A830">SYNOD &#183; DISPUTE ESCROW ON ACCORD</text>

  <!-- headline -->
  <text x="76" y="234" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="86" font-weight="600" letter-spacing="-2" fill="#F0F6FC">Convene the verdict.</text>

  <!-- code surface -->
  <rect x="80" y="300" width="1040" height="128" rx="10" fill="#11161D" stroke="#1F2630" stroke-width="1.5"/>
  <text x="116" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#C9D1D9">open_case()</text>
  <text x="436" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#F0A830">&#8594;</text>
  <text x="520" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#C9D1D9">join()</text>
  <text x="708" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#F0A830">&#8594;</text>
  <text x="792" y="376" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="44" fill="#C9D1D9">claim()</text>

  <!-- footer line -->
  <text x="80" y="560" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="26" fill="#7D8590">synod.useaccord.xyz &#160;&#183;&#160; N-party dispute escrow, adjudicated by Accord</text>

  <!-- assembly glyph, bottom-right: party nodes converge on one amber verdict -->
  <g transform="translate(1060,516)" stroke-width="2.4">
    <circle cx="0" cy="0" r="5" fill="#7D8590" stroke="none"/>
    <circle cx="0" cy="48" r="5" fill="#7D8590" stroke="none"/>
    <circle cx="34" cy="-6" r="5" fill="#7D8590" stroke="none"/>
    <line x1="2" y1="3" x2="30" y2="17" stroke="#7D8590" opacity="0.7"/>
    <line x1="2" y1="45" x2="30" y2="27" stroke="#7D8590" opacity="0.7"/>
    <line x1="33" y1="0" x2="35" y2="19" stroke="#7D8590" opacity="0.7"/>
    <rect x="27" y="20" width="14" height="14" transform="rotate(45 34 27)" fill="#F0A830" stroke="none"/>
  </g>
</svg>
