[features]
seeds = false
skip-lint = false

# Program id (keypair in target/deploy/accord-keypair.json). `anchor build`
# normally provisions this; it is blocked by the platform-tools/edition2024
# toolchain issue — see AGENTS.md.
[programs.localnet]
accord = "5DjgEFpkzXk37uENkfGptfARTEmr4aUoZXcSAXMYKzLZ"

[programs.devnet]
accord = "5DjgEFpkzXk37uENkfGptfARTEmr4aUoZXcSAXMYKzLZ"

[registry]
url = "https://anchor.projectserum.com"

[provider]
