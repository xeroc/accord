[workspace]
members = ["programs/accord", "programs/canon", "programs/synod"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# `init-if-needed`: required for `stake`'s top-up pattern (init_or_update the
# JurorStake PDA + lazily create the Subaccord vault ATA on first stake).
# Safe here — both accounts are zero-fill on init with no privileged init logic.
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token", "associated_token"] }
# `solana-program` was split into smaller crates in anchor 0.32 / Solana 2.x;
# `anchor_lang::solana_program` no longer re-exports `hash`. Anchor 1.0 relaxed
# the separate-dep check (#4166), so we pull it directly for `hashv`
# (commit/reveal hashing + merkle verification).
solana-program = "3"
# VRF via the unified SDK (magicblock skill known-good snapshot). The `vrf`
# feature re-exports `ephemeral-vrf-sdk` under `ephemeral_rollups_sdk::vrf` and
# flips the `#[vrf]` macro to emit `::ephemeral_rollups_sdk::vrf` paths — so no
# direct `ephemeral-vrf-sdk` dependency is needed.
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Anchor's derive macros (#[derive(Accounts)], #[account], #[program])
# internally emit `#[cfg(feature = "anchor-debug")]`, `#[cfg(feature =
# "custom-heap")]`, `#[cfg(feature = "custom-panic")]`, and `#[cfg(solana)]`.
# Rust 1.80+ validates cfg values against the crate's known feature list and
# warns on unlisted ones — but these cfgs originate inside anchor's macros,
# not our code, so we can't declare them as features. Whitelisting them as
# expected keeps check-cfg ON for our own cfgs (catches real typos) while
# silencing the macro-emitted noise. See rust-lang/rust#216908.
[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    # `solana` is a BPF target_os value (solana_program_entrypoint's
    # custom_heap_default / custom_panic_default emit cfg(target_os = "solana")
    # via anchor's #[program] macro). It's not a bare flag.
    'cfg(target_os, values("solana"))',
]
