name: Tests

on:
  workflow_call:

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run -r --filter "./packages/*" --filter "./apps/*" lint

      - name: Run build
        run: pnpm run -r --filter "./packages/*" --filter "./apps/*" build

      - name: Run tests
        run: pnpm run -r --filter "./packages/*" --filter "./apps/*" test
