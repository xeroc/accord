name: Tests

on:
  workflow_call:

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup bun (for cranker)
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run -r --filter "./packages/*" --filter "./apps/*" build

      - name: Run linter
        run: pnpm run -r --filter "./packages/*" --filter "./apps/*" lint

      # Throwaway signer (pubkey Em3zj6e7a1UxyyB2WtHLjCVHN3CN1eVJm5d7vUAzgvb6) so
      # apps/cli tests that resolve the wallet via the default path
      # (~/.config/solana/id.json) — i.e. without --keypair / $ANCHOR_WALLET /
      # $ACCORD_KEYPAIR_PATH — find a loadable keypair. No funds; never used on
      # a real network. Negative-path tests override HOME/ANCHOR_WALLET locally,
      # so this does not mask them.
      - name: Provision CI wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          cp .github/ci-wallet/id.json "$HOME/.config/solana/id.json"

      - name: Run tests
        run: pnpm run -r --filter "./packages/*" --filter "./apps/*" test
