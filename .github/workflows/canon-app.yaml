name: Build and Deploy Canon dApp to GitHub Pages

# Canon registry dApp (apps/canon) — static React + Vite SPA.
# Mirrors apps/app: HashRouter (no server routing) + vite `base: "./"`, so the
# built index.html is portable under a sub-path.
#
# Coexists with the landing page on the single `gh-pages` branch: canon is
# published under `canon/` (destination_dir) and both this workflow and
# landing-page.yaml run with `keep_files: true` so neither wipes the other.
# Served at <pages-host>/canon/  →  hash routes resolve as /canon/#/lists/:addr.
#
# `app-exists` guard: apps/canon is scaffolded by a separate bean (E1). Until it
# lands, this job skips cleanly so the pipeline stays green; it auto-activates
# the moment the app directory appears.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Detect app
        id: app
        run: |
          if [ -d apps/canon ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install pnpm
        if: steps.app.outputs.exists == 'true'
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.app.outputs.exists == 'true'
        working-directory: ./apps/canon
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_RPC_URL: ${{ secrets.VITE_CANON_RPC_URL }}
          VITE_EVIDENCE_DAEMON_URL: ${{ secrets.VITE_CANON_EVIDENCE_DAEMON_URL }}
          VITE_ACCORD_APP_URL: ${{ secrets.VITE_CANON_ACCORD_APP_URL }}
          VITE_FEATURED_LIST: ${{ secrets.VITE_CANON_FEATURED_LIST }}

      - name: Deploy to GitHub Pages (canon/)
        if: steps.app.outputs.exists == 'true' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./apps/canon/dist
          destination_dir: canon
          keep_files: true
