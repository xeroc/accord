---
name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      registry:
        required: false
        default: ghcr.io
        type: string
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      push:
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      registry:
        required: false
        default: ghcr.io
        type: string
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      push:
        required: false
        default: true
        type: boolean
jobs:
  build:
    name: Build and Push docker container
    runs-on: ubuntu-latest

    # Required to write to ghcr.io
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/xeroc/useaccord-${{ inputs.package }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=${{ github.ref_name }}.${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: apps/${{ inputs.package }}/Dockerfile
          context: .
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ inputs.version }}
