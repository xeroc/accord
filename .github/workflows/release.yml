name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: nothing is granted unless a job declares it.
permissions: {}

env:
  NODE_VERSION: "22"

jobs:
  landingpage:
    name: Update Landing Page
    secrets: inherit
    permissions:
      contents: write # gh-pages push (deploy step is gated to main inside the called workflow)
    uses: ./.github/workflows/landing-page.yaml

  program-tests:
    name: Program Tests
    secrets: inherit
    permissions:
      contents: read
    uses: ./.github/workflows/program-tests.yml
    with:
      program: accord

  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  changeset-status:
    name: Changeset present
    # The auto-generated version PR (changeset-release/*) never carries changesets — skip it.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # status diffs packages against the merge base

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when packages changed since main but no changeset was added.
      # `origin/main`, not `main`: PR checkouts have no local main branch for
      # merge-base to resolve. Escape hatch for CI-only changes: `pnpm changeset --empty`.
      - name: Check for changeset
        run: pnpm changeset status --since origin/main

  build-evidence-docker:
    name: Build Evidence Daemon Image
    # Images ship only when a release actually published a new version — not on
    # every main push. Tag = the released version (see release job outputs).
    needs: [tests, release]
    if: needs.release.outputs.published == 'true'
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      registry: ghcr.io
      package: evidence-daemon
      version: ${{ needs.release.outputs.version }}

  build-cranker-docker:
    name: Build Cranker Image
    needs: [tests, release]
    if: needs.release.outputs.published == 'true'
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      registry: ghcr.io
      package: cranker
      version: ${{ needs.release.outputs.version }}

  build-jurat-docker:
    name: Build Jurat Image
    needs: [tests, release]
    if: needs.release.outputs.published == 'true'
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      registry: ghcr.io
      package: jurat
      version: ${{ needs.release.outputs.version }}

  release:
    name: Version & Publish
    needs: [tests, program-tests]
    # Version/Publish runs on main only (push, or manual dispatch to retry a
    # failed publish) and never before the test pipeline is green.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.tag.outputs.version }}
    permissions:
      contents: write # commit version changes + push tags
      pull-requests: write # version PR
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # pnpm 9 delegates `pnpm publish` to the npm CLI on PATH; npm >= 11.5.1
      # speaks OIDC trusted publishing natively. Upgrade in place so the
      # delegated publish authenticates via the job's id-token — no npm token.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-edit (workspace version bump)
        run: cargo install cargo-edit --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # names silently no-op here and would fall back to plain `changeset version`.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm run release:version
          publish-script: pnpm run release:publish
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false # npm with provenance only; flip on for GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # changelog-github inside release:version
          NPM_CONFIG_PROVENANCE: "true"

      - name: Tag umbrella version
        id: tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          V=$(node -p 'require("./packages/sdk/package.json").version')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          git tag "v$V"
          git push origin "v$V"
