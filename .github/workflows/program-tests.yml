name: Program Tests

# Reusable program test routine (modelled on Tributary's program-tests.yml),
# adapted for Accord's two-harness model + Surfnet runbook deployment.
#
# Accord-specific divergences from the Tributary template (each is load-bearing):
#   - `anchor build --ignore-keys` is MANDATORY: the deploy keypair is gitignored,
#     so every clean checkout mints a random one; `--ignore-keys` stops it from
#     rewriting `declare_id!` (cordhVoshqRV6kzGBmM89A66wuusJGsDCvLMHPLyKed).
#     See AGENTS.md §Gotchas. NEVER run `anchor build` without it here.
#   - Surfpool starts with `--yes --db :memory: --no-tui` (not Tributary's
#     `--legacy-anchor-compatibility --no-tui`): `--yes` skips runbook-generation
#     prompts, `--db :memory:` guarantees a fresh Surfnet each run (singleton-PDA
#     restart-safety), and the committed runbook `runbooks/deployment/main.tx`
#     deploys BOTH accord + canon via the `instant_surfnet_deployment` cheatcode.
#   - No mainnet fork warm-up: unlike Tributary (whose program lives on mainnet,
#     so lazy-fork getProgramAccounts latency is the #1 flake source), Accord is
#     not deployed to mainnet and the jest suite drives `surfnet_*` cheatcodes +
#     airdrops rather than mainnet account state. Warm-up would be a no-op.
#   - LiteSVM Rust unit tests run inline (Accord's fast inner TDD loop) BEFORE
#     Surfpool: `cargo test --features no-entrypoint` over accord + canon. The
#     `.so` each loads is already emitted by the preceding `anchor build`, so no
#     redundant `cargo build-sbf` / `--tools-version` dance is needed.
#   - The suite is `pnpm --filter @useaccord/tests test` (Accord has no
#     `anchor run surfpool` script; Anchor.toml `[scripts] test` resolves to this)
#     and reads ACCORD_RPC_URL / ACCORD_WS_URL / ACCORD_PAYER_PATH, not ANCHOR_*.

on:
  workflow_call:
    inputs:
      solana_version:
        type: string
        required: false
        # Makefile default; Anchor.toml [toolchain] is empty, so we cannot rely
        # on extract-versions alone.
        default: "3.1.10"
      anchor_version:
        type: string
        required: false
        default: "1.0.2"
      # Optional cargo features to pass to `anchor build` (e.g. a future
      # "mainnet" feature gate). Unit tests always use `no-entrypoint` regardless.
      features:
        type: string
        required: false
        default: ""
      # Surfpool version tag to install (default: latest). Pin for reproducibility.
      surfpool_version:
        type: string
        required: false
        default: "latest"

env:
  # Surfnet exposes the standard Solana JSON-RPC on localhost:8899 and WS on
  # 8900 — the endpoints tests/src/setup/env.ts defaults to.
  ACCORD_RPC_URL: http://127.0.0.1:8899
  ACCORD_WS_URL: ws://127.0.0.1:8900
  ACCORD_PAYER_PATH: /home/runner/.config/solana/id.json
  # Harmless back-compat: some Anchor tooling reads ANCHOR_WALLET.
  ANCHOR_WALLET: /home/runner/.config/solana/id.json
  # Used by the health-poll curl below.
  SURFPOOL_HOST: "127.0.0.1"
  SURFPOOL_PORT: "8899"

jobs:
  test:
    name: Program Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          pnpm install
          corepack enable

      - name: Build SDK
        # The jest suite imports @useaccord/sdk (`./dist/index.js`); it must be
        # built before tests resolve it. Mirrors the Makefile `sdk` target.
        working-directory: ./packages/sdk
        run: pnpm run build

      - name: Extract versions
        if: inputs.solana_version == '' || inputs.anchor_version == ''
        uses: solana-developers/github-actions/extract-versions@v0.2.5
        id: versions

      - name: Setup toolchain
        uses: solana-developers/github-actions/setup-all@v0.2.5
        with:
          solana_version: ${{ inputs.solana_version || steps.versions.outputs.solana_version }}
          anchor_version: ${{ inputs.anchor_version || steps.versions.outputs.anchor_version }}
          node_version: 22

      - name: Ensure test wallet exists
        shell: bash
        run: |
          mkdir -p "$(dirname "$ACCORD_PAYER_PATH")"
          if [ ! -f "$ACCORD_PAYER_PATH" ]; then
            solana-keygen new --no-bip39-passphrase --silent --outfile "$ACCORD_PAYER_PATH"
          fi
          echo "Wallet: $(solana-keygen pubkey "$ACCORD_PAYER_PATH")"

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: ./node_modules/
          key: node-modules-${{ runner.os }}-build-v0.1-${{ inputs.anchor_version || steps.versions.outputs.anchor_version }}-${{ inputs.solana_version || steps.versions.outputs.solana_version }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          shared-key: "program-tests-${{ inputs.anchor_version || steps.versions.outputs.anchor_version }}-${{ inputs.solana_version || steps.versions.outputs.solana_version }}"

      # ── Program build ────────────────────────────────────────────────────
      # `anchor build` emits target/deploy/{accord,canon}.so AND regenerates the
      # IDL the Codama client is rendered from. `--ignore-keys` is MANDATORY
      # (see header) — every Makefile target passes it; so does this one.
      - name: Build programs
        shell: bash
        env:
          CARGO_INCREMENTAL: 1
          CARGO_NET_RETRY: 10
          RUST_BACKTRACE: 1
        run: |
          echo "Building programs: accord, canon"
          FEATURES="${{ inputs.features }}"
          if [ -n "$FEATURES" ]; then
            anchor build --ignore-keys -- --features "$FEATURES"
          else
            anchor build --ignore-keys
          fi
          test -f target/deploy/accord.so
          test -f target/deploy/canon.so

      # ── LiteSVM Rust unit tests (fast inner TDD loop, no validator) ───────
      # Each *_litesvm.rs test reads target/deploy/<prog>.so (already built
      # above), so there is no need for `cargo build-sbf` / `--tools-version`
      # here. `--features no-entrypoint` is REQUIRED: the program's `entrypoint!`
      # symbol collides with a builtin when the crate is linked into the test
      # binary. See AGENTS.md "LiteSVM --features no-entrypoint".
      - name: Run LiteSVM unit tests
        shell: bash
        env:
          CARGO_INCREMENTAL: 1
          CARGO_NET_RETRY: 10
          RUST_BACKTRACE: 1
        run: |
          cargo test --manifest-path programs/accord/Cargo.toml --features no-entrypoint
          cargo test --manifest-path programs/canon/Cargo.toml --features no-entrypoint

      # ── Surfpool: install + start (deploys accord + canon via runbook) ────
      - name: Install Surfpool
        shell: bash
        run: |
          VERSION="${{ inputs.surfpool_version }}" curl -sL https://run.surfpool.run/ | bash
          # Installer drops the binary in ~/.local/bin; expose it to later steps.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/surfpool" --version

      - name: Start Surfpool (background)
        timeout-minutes: 5
        shell: bash
        run: |
          # `--yes` skips runbook-generation prompts; `--db :memory:` yields a
          # fresh Surfnet each run (restart-safe for singleton PDAs like
          # PauseState); `--no-tui` for non-interactive CI. The committed runbook
          # `runbooks/deployment/main.tx` auto-deploys accord + canon on start.
          surfpool start --yes --db :memory: --no-tui > "$RUNNER_TEMP/surfpool.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/surfpool.pid"
          echo "Surfpool PID: $(cat "$RUNNER_TEMP/surfpool.pid")"

          echo "Waiting for Surfpool RPC to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf -X POST "http://$SURFPOOL_HOST:$SURFPOOL_PORT" \
                -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
                | grep -q '"ok"'; then
              echo "Surfpool healthy after ${i} poll(s)."
              exit 0
            fi
            # Bail early if the process died.
            if ! kill -0 "$(cat "$RUNNER_TEMP/surfpool.pid")" 2>/dev/null; then
              echo "::error::Surfpool process exited during startup"
              cat "$RUNNER_TEMP/surfpool.log" || true
              exit 1
            fi
            sleep 2
          done
          echo "::error::Surfpool did not become healthy in 120s"
          cat "$RUNNER_TEMP/surfpool.log" || true
          exit 1

      # ── Run the e2e suite ────────────────────────────────────────────────
      # `pnpm --filter @useaccord/tests test` = `make test_surfpool` =
      # Anchor.toml `[scripts] test`. It drives the real program through the
      # @useaccord/sdk facade against the running Surfnet. jest.config.js forces
      # serial execution (maxWorkers: 1) because surfnet_timeTravel advances the
      # GLOBAL clock and PauseState is a singleton — the whole suite runs GREEN
      # together on one Surfnet. See AGENTS.md "The green rule (non-negotiable)".
      - name: Run e2e suite
        timeout-minutes: 30
        shell: bash
        env:
          CARGO_INCREMENTAL: 1
          CARGO_NET_RETRY: 10
          RUST_BACKTRACE: 1
        run: |
          echo "Running jest suite against Surfnet (via \`pnpm --filter @useaccord/tests test\`)"
          pnpm --filter @useaccord/tests test

      # ── Diagnostics + cleanup ────────────────────────────────────────────
      - name: Dump Surfpool log on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::Surfpool log (tail)"
          tail -n 400 "$RUNNER_TEMP/surfpool.log" 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload Surfpool log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-log
          path: ${{ runner.temp }}/surfpool.log
          if-no-files-found: ignore

      - name: Stop Surfpool
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/surfpool.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/surfpool.pid")" 2>/dev/null || true
          fi

      - name: Check Test Results
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "Tests failed! Check the Surfpool log artifact + logs above for details."
          exit 1
